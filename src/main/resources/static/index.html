<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare Dashboard</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --dark: #1b263b;
            --light: #f8f9fa;
            --success: #4cc9f0;
            --warning: #f72585;
            --gray: #adb5bd;
            --light-gray: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid var(--light-gray);
        }

        h1 {
            color: var(--secondary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .card-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 15px 0;
        }

        .checkbox-container input {
            width: auto;
            margin-right: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--secondary);
        }

        .list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .list-item {
            background-color: var(--light-gray);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .list-item:hover {
            transform: translateX(5px);
        }

        .list-item h4 {
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .list-item p {
            color: var(--dark);
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--gray);
        }

        .error {
            color: var(--warning);
            background-color: rgba(247, 37, 133, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--gray);
            font-style: italic;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--light-gray);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>PetCare Dashboard</h1>
        <p>Управляйте здоровьем и уходом за вашими питомцами</p>
    </header>

    <div class="dashboard">
        <!-- Секция профилей питомцев -->
        <div class="card">
            <div class="card-header">
                <h2>Профили питомцев</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <h3>Добавить новый профиль</h3>
                    <label for="petName">Имя питомца</label>
                    <input type="text" id="petName" placeholder="Введите имя">

                    <label for="petBreed">Порода</label>
                    <input type="text" id="petBreed" placeholder="Введите породу">

                    <div class="checkbox-container">
                        <input type="checkbox" id="petAllergy">
                        <label for="petAllergy">Есть аллергия</label>
                    </div>

                    <button class="btn" onclick="addPetProfile()">Добавить профиль</button>
                    <div id="petError" class="error"></div>
                </div>

                <div class="list" id="petProfilesList">
                    <div class="loading">Загрузка профилей...</div>
                </div>
            </div>
        </div>

        <!-- Секция рекомендаций -->
        <div class="card">
            <div class="card-header">
                <h2>Рекомендации</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <h3>Добавить рекомендацию</h3>

                    <label for="recommendationPetId">Питомец</label>
                    <select id="recommendationPetId">
                        <option value="">Выберите питомца</option>
                    </select>

                    <label for="recommendationText">Текст рекомендации</label>
                    <textarea id="recommendationText" placeholder="Введите рекомендации по уходу"></textarea>

                    <button class="btn" onclick="addRecommendation()">Добавить рекомендацию</button>
                    <div id="recommendationError" class="error"></div>
                </div>

                <div class="list" id="recommendationsList">
                    <div class="loading">Загрузка рекомендаций...</div>
                </div>
            </div>
        </div>

        <!-- Секция напоминаний -->
        <div class="card">
            <div class="card-header">
                <h2>Напоминания</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <h3>Добавить напоминание</h3>

                    <label for="reminderPetId">Питомец</label>
                    <select id="reminderPetId">
                        <option value="">Выберите питомца</option>
                    </select>

                    <label for="reminderType">Тип напоминания</label>
                    <select id="reminderType">
                        <option value="VACCINATION">Вакцинация</option>
                        <option value="FEEDING">Кормление</option>
                        <option value="TREATMENT">Лечение</option>
                        <option value="OTHER">Другое</option>
                    </select>

                    <label for="reminderDate">Дата</label>
                    <input type="date" id="reminderDate" min="">

                    <button class="btn" onclick="addReminder()">Добавить напоминание</button>
                    <div id="reminderError" class="error"></div>
                </div>

                <div class="list" id="remindersList">
                    <div class="loading">Загрузка напоминаний...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://localhost:8080/api/pet';

    document.addEventListener('DOMContentLoaded', function() {
        const dateInput = document.getElementById('reminderDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        loadPetProfiles();
        loadRecommendations();
        loadReminders();
    });

    // ===== Функции для работы с профилями питомцев =====
    async function loadPetProfiles() {
        try {
            const response = await fetch(`${API_BASE_URL}/profiles`);
            const profiles = await response.json();

            const petProfilesList = document.getElementById('petProfilesList');
            petProfilesList.innerHTML = '';

            if (profiles.length === 0) {
                petProfilesList.innerHTML = '<div class="empty-state">Нет добавленных профилей</div>';
                return;
            }

            const recommendationSelect = document.getElementById('recommendationPetId');
            const reminderSelect = document.getElementById('reminderPetId');

            while (recommendationSelect.options.length > 1) {
                recommendationSelect.remove(1);
            }
            while (reminderSelect.options.length > 1) {
                reminderSelect.remove(1);
            }

            const uniquePets = new Map();
            profiles.forEach(profile => {
                const profileElement = document.createElement('div');
                profileElement.className = 'list-item';
                profileElement.innerHTML = `
                    <h4>${profile.name}</h4>
                    <p><strong>Порода:</strong> ${profile.breed}</p>
                    <p><strong>Аллергия:</strong> ${profile.hasAllergy ? 'Да' : 'Нет'}</p>
                    <p><strong>ID:</strong> ${profile.id}</p>
                `;
                petProfilesList.appendChild(profileElement);

                const petKey = `${profile.name}|${profile.breed}`;
                if (!uniquePets.has(petKey)) {
                    uniquePets.set(petKey, profile.id);

                    const option = document.createElement('option');
                    option.value = profile.id;
                    option.textContent = `${profile.name} (${profile.breed})`;

                    recommendationSelect.appendChild(option.cloneNode(true));
                    reminderSelect.appendChild(option.cloneNode(true));
                }
            });
        } catch (error) {
            document.getElementById('petProfilesList').innerHTML = `
                <div class="error">Ошибка загрузки профилей: ${error.message}</div>
            `;
        }
    }

    async function addPetProfile() {
        const name = document.getElementById('petName').value.trim();
        const breed = document.getElementById('petBreed').value.trim();
        const hasAllergy = document.getElementById('petAllergy').checked;

        if (!name || !breed) {
            document.getElementById('petError').textContent = 'Пожалуйста, заполните имя и породу';
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/profile`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name,
                    breed,
                    hasAllergy
                })
            });

            if (!response.ok) throw new Error('Ошибка при добавлении профиля');

            document.getElementById('petName').value = '';
            document.getElementById('petBreed').value = '';
            document.getElementById('petAllergy').checked = false;
            document.getElementById('petError').textContent = '';

            loadPetProfiles();
        } catch (error) {
            document.getElementById('petError').textContent = error.message;
        }
    }

    // ===== Функции для работы с рекомендациями =====
    async function loadRecommendations() {
        try {
            const response = await fetch(`${API_BASE_URL}/recommendations`);
            const recommendations = await response.json();

            const recommendationsList = document.getElementById('recommendationsList');
            recommendationsList.innerHTML = '';

            if (recommendations.length === 0) {
                recommendationsList.innerHTML = '<div class="empty-state">Нет добавленных рекомендаций</div>';
                return;
            }

            recommendations.forEach(recommendation => {
                const recommendationElement = document.createElement('div');
                recommendationElement.className = 'list-item';
                recommendationElement.innerHTML = `
                    <h4>Рекомендация для питомца ID: ${recommendation.petId}</h4>
                    <p>${recommendation.text}</p>
                `;
                recommendationsList.appendChild(recommendationElement);
            });
        } catch (error) {
            document.getElementById('recommendationsList').innerHTML = `
                <div class="error">Ошибка загрузки рекомендаций: ${error.message}</div>
            `;
        }
    }

    async function addRecommendation() {
        const petId = document.getElementById('recommendationPetId').value;
        const text = document.getElementById('recommendationText').value.trim();

        if (!petId || !text) {
            document.getElementById('recommendationError').textContent = 'Пожалуйста, выберите питомца и введите текст рекомендации';
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/recommendation`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    petId,
                    text
                })
            });

            if (!response.ok) throw new Error('Ошибка при добавлении рекомендации');

            document.getElementById('recommendationText').value = '';
            document.getElementById('recommendationError').textContent = '';

            loadRecommendations();
        } catch (error) {
            document.getElementById('recommendationError').textContent = error.message;
        }
    }

    // ===== Функции для работы с напоминаниями =====
    async function loadReminders() {
        try {
            const response = await fetch(`${API_BASE_URL}/reminders`);
            const reminders = await response.json();

            const remindersList = document.getElementById('remindersList');
            remindersList.innerHTML = '';

            if (reminders.length === 0) {
                remindersList.innerHTML = '<div class="empty-state">Нет добавленных напоминаний</div>';
                return;
            }

            reminders.forEach(reminder => {
                const reminderElement = document.createElement('div');
                reminderElement.className = 'list-item';
                reminderElement.innerHTML = `
                    <h4>${getReminderType(reminder.type)} для питомца ID: ${reminder.petId}</h4>
                    <p><strong>Дата:</strong> ${new Date(reminder.remindDate).toLocaleDateString()}</p>
                `;
                remindersList.appendChild(reminderElement);
            });
        } catch (error) {
            document.getElementById('remindersList').innerHTML = `
                <div class="error">Ошибка загрузки напоминаний: ${error.message}</div>
            `;
        }
    }

    function getReminderType(type) {
        const types = {
            'VACCINATION': 'Вакцинация',
            'FEEDING': 'Кормление',
            'TREATMENT': 'Лечение',
            'OTHER': 'Другое'
        };
        return types[type] || type;
    }

    async function addReminder() {
        const petId = document.getElementById('reminderPetId').value;
        const type = document.getElementById('reminderType').value;
        const remindDate = document.getElementById('reminderDate').value;
        const today = new Date().toISOString().split('T')[0];

        if (!petId) {
            document.getElementById('reminderError').textContent = 'Пожалуйста, выберите питомца';
            return;
        }

        if (!remindDate) {
            document.getElementById('reminderError').textContent = 'Пожалуйста, укажите дату';
            return;
        }

        if (remindDate < today) {
            document.getElementById('reminderError').textContent = 'Нельзя выбрать прошедшую дату';
            return;
        }

        try {
            const response = await fetch(`${API_BASE_URL}/reminder`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    petId,
                    type,
                    remindDate
                })
            });

            if (!response.ok) throw new Error('Ошибка при добавлении напоминания');

            document.getElementById('reminderDate').value = '';
            document.getElementById('reminderError').textContent = '';

            loadReminders();
        } catch (error) {
            document.getElementById('reminderError').textContent = error.message;
        }
    }
</script>
</body>
</html>
